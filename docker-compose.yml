services:
  postgres:
    image: postgres:17-alpine
    container_name: scout_postgres
    environment:
      POSTGRES_DB: scout
      POSTGRES_USER: scout
      POSTGRES_PASSWORD: scout
    ports:
      - "5433:5432" # 5432 is taken by another local project
    volumes:
      - scout_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scout"]
      interval: 2s
      retries: 20

volumes:
  scout_pg:
